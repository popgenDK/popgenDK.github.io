  highlight: 1
  website: https://website.popgen.dk/

- name: Anders Albrechtsen
  title: Professor, Biology, University of Copenhagen
  image: AA3.jpg
  description: Instructor in next-generation sequencing data, population genomic methods, and demographic inference.
  highlight: 1
  website: https://website.popgen.dk/

- name: Ida Moltke
  title: Associate Professor, Biology, University of Copenhagen
  image: Ida-Moltke.jpeg
  description: Develops and applies statistical and computational methods to population and medical genomic data. She will teach population structure and admixture analysis.
  highlight: 1
  website: https://idamoltke.wordpress.com/

- name: Nuno Martins
  title: Postdoctoral Researcher, Biology, University of Copenhagen
  image: Nuno-Martins.jpeg
  description: Joined Ida Moltke's lab in January 2025 after completing his PhD at the Globe Institute. His research focuses on population genomics of Greenlandic mammals.
  highlight: 1
  website: https://idamoltke.wordpress.com/people-in-my-lab/

- name: Harvinder Kaur Pawar
  title: Postdoctoral Researcher, Biology, University of Copenhagen
  image: Harvinder-Kaur-Pawar.jpeg
  description: Joined Ida Moltke's lab in April 2025 after completing her PhD in Barcelona. Her research focuses on population genomics of Greenlandic mammals. She will teach gene flow and D-statistics and present research on gorilla population genomics.
  highlight: 1
  website: https://idamoltke.wordpress.com/people-in-my-lab/

- name: Sabhrina Gita Aninta
  title: PhD Student, Biology, University of Copenhagen
  image: Sabhrina-Gita-Aninta.jpg
  description: Joined Rasmus Heller's group in October 2023 after completing her PhD in the UK. Her work connects ecology and evolution to improve biodiversity conservation and uses genome-wide variation to study populations and identify priorities for conservation.
  highlight: 1
  website: https://natureaccordingtosam.wordpress.com/sabhrina-gita-aninta/

- name: Thomas Bøggild
  title: PhD Student, Biology, University of Copenhagen
  image: thomas.png
  description: PhD student in the groups of Rasmus Heller and Anders Albrechtsen. He is a workshop instructor and practical-session facilitator.
  highlight: 1
